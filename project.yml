name: HoraDePausar
options:
  bundleIdPrefix: com.danielmarques
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Local ad-hoc signature only: no Developer ID, no notarization, no App Store.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  HoraDePausarCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielmarques.horadepausar.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  HoraDePausar:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - target: HoraDePausarCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Hora de Pausar"
        CFBundleName: "Hora de Pausar"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSHumanReadableCopyright: "© 2026 TechDaniel's. Texto bíblico: Bíblia Livre (BLIVRE), versão de fevereiro de 2018, CC BY 3.0 BR. English text: World English Bible (WEB), public domain."
    settings:
      base:
        # Kept from the code-name era: macOS keys the saved history (Application Support), the
        # preferences and the login item to this identifier, so changing it would reset them.
        PRODUCT_BUNDLE_IDENTIFIER: com.danielmarques.selah
        PRODUCT_NAME: "Hora de Pausar"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HoraDePausarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: HoraDePausarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielmarques.horadepausar.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HoraDePausar:
    build:
      targets:
        HoraDePausar: all
        HoraDePausarCore: all
    test:
      targets:
        - HoraDePausarTests
